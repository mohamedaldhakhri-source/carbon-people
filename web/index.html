<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carbon People</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Carbon Engineering Design identity: black frame, white ground, and the three blocks of the logo (red, yellow, blue) used as small accents */
:root{
  --red:#b82039; --yellow:#ddc762; --blue:#146698;
  --bg:#f5f5f2; --surface:#ffffff; --sunk:#efefeb; --line:#e3e3de; --line-strong:#cfcfc8;
  --ink:#121212; --ink-2:#3a3a38; --muted:#6e6e69;
  --primary:#121212; --primary-ink:#ffffff; --link:#146698;
  --accent-soft:#e3eef5;
  --good:#1e7a46; --good-soft:#e2f2e8; --warn:#8a6a00; --warn-soft:#f8f0cf; --bad:#b82039; --bad-soft:#f9e3e6;
  --rail:#0b0b0b; --rail-ink:#a7a7a2; --rail-active:#1c1c1b;
  --f-display:"Montserrat",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:10px; --shadow:0 1px 2px rgb(0 0 0 / .04),0 2px 8px rgb(0 0 0 / .04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f0f; --surface:#171716; --sunk:#1f1f1e; --line:#2a2a28; --line-strong:#3a3a37;
  --ink:#f0f0ec; --ink-2:#cfcfca; --muted:#97978f;
  --primary:#f0f0ec; --primary-ink:#0b0b0b; --link:#5fa8d8; --accent-soft:#16303f;
  --good:#5cc98a; --good-soft:#15291d; --warn:#e2c45a; --warn-soft:#2e2812; --bad:#ef6f84; --bad-soft:#341820;
  --rail:#050505; --rail-active:#191918; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--link)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* rail */
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 14px 18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;color:#fff;text-decoration:none}
.brand img{height:44px;width:auto;display:block}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--rail-ink);letter-spacing:.02em;margin-top:3px}
.blocks{display:flex;gap:4px;padding:0 8px}
.blocks i{height:4px;flex:1;border-radius:1px}
.blocks i:nth-child(1){background:#fff;flex:.8}.blocks i:nth-child(2){background:var(--red)}.blocks i:nth-child(3){background:var(--yellow);flex:1.6}.blocks i:nth-child(4){background:var(--blue)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#6c6c67;padding:12px 10px 4px;font-weight:600}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:8px;font-weight:500;display:flex;gap:11px;align-items:center;color:var(--rail-ink);position:relative;font-size:13.5px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button span.l{flex:1}
.nav button:hover{background:var(--rail-active);color:#fff}
.nav button[aria-current="page"]{background:var(--rail-active);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:3px;background:var(--yellow);border-radius:0 2px 2px 0}
.nav button:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
.count{font-size:11px;font-weight:600;background:var(--red);color:#fff;border-radius:10px;padding:0 7px;line-height:18px}
.who{margin-top:auto;font-size:12.5px;display:flex;flex-direction:column;gap:10px;padding:14px 8px 0;border-top:1px solid #222}
.who .me{display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.who b{color:#fff;font-weight:600;display:block;font-size:13px}
.who .btn{background:transparent;color:var(--rail-ink);border-color:#2c2c2a;font-size:12px;padding:5px 10px}
.who .btn:hover{color:#fff;border-color:#444}

/* main */
main{padding:30px 36px 56px;min-width:0;max-width:1440px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 14px;letter-spacing:-.005em}
.sub{color:var(--muted);margin:4px 0 0}
.grid{display:grid;gap:18px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
details.panel>summary{cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{content:"+";display:inline-block;width:18px;font-weight:700;color:var(--muted)}
details.panel[open]>summary::before{content:"–"}
.tile{position:relative;padding:18px 20px 18px 22px;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--yellow)}
.tiles>.tile:nth-child(4n+2)::before{background:var(--red)}
.tiles>.tile:nth-child(4n+3)::before{background:var(--blue)}
.tiles>.tile:nth-child(4n+4)::before{background:var(--ink)}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;margin:6px 0 2px;letter-spacing:-.01em}
.tile .n{font-size:12.5px;color:var(--muted)}

/* tables */
.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--surface)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer;transition:background .12s} tbody tr.click:hover{background:var(--sunk)}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
td.mono{white-space:nowrap}

/* pills, buttons, forms */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--link)} .p-mute{background:var(--sunk);color:var(--muted)}
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:8px;padding:8px 15px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s,transform .05s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)} .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.25)}
.btn.danger{color:var(--bad)} .btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%;transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgb(20 102 152 / .15);outline:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px}
.full{grid-column:1/-1}
.calc{background:var(--sunk);border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;border-left:3px solid var(--blue)}
.msg{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;border-left:3px solid currentColor}
.msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.good{background:var(--good-soft);color:var(--good)}
.bal{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bal div{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg)}
.bal b{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.bal span{display:block;font-size:12px;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgb(10 10 10 / .38);backdrop-filter:blur(2px);z-index:19;animation:fade .15s}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);padding:26px 26px 32px;overflow:auto;box-shadow:-12px 0 40px rgb(0 0 0 / .18);z-index:20;animation:slide .18s ease-out}
.drawer h2{font-size:18px}
@keyframes slide{from{transform:translateX(24px);opacity:0}} @keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{animation:none}}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px;margin:0 0 20px;padding:14px 16px;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;font-weight:500;z-index:30;max-width:90vw;border-left:4px solid var(--yellow);box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.empty{color:var(--muted);padding:18px 0;text-align:center;font-size:13px}

/* sign in */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login .side{background:#0b0b0b;color:#cfcfca;display:flex;flex-direction:column;justify-content:space-between;padding:44px 48px;position:relative;overflow:hidden}
.login .side img{width:min(260px,60%);height:auto;margin:auto 0}
.login .side p{margin:0;font-size:13px;color:#8d8d87;max-width:360px}
.login .side .blocks{padding:0;max-width:260px}
.login .formside{display:grid;place-items:center;padding:32px 24px;background:var(--bg)}
.login form{width:min(380px,100%)}
.login h1{font-size:28px;margin-bottom:6px}
.loading{padding:40px;color:var(--muted)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;gap:14px;padding:16px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav .grp{display:none}
  .nav button[aria-current="page"]::before{display:none}
  .who{margin-top:0;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  main{padding:22px 16px 44px}
  .two{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr;gap:12px}
  .tile .v{font-size:24px}
  .login{grid-template-columns:1fr}
  .login .side{padding:28px 24px;min-height:auto;gap:18px}
  .login .side img{width:140px;margin:0}
}
@media print{.rail,.noprint{display:none!important}.app{display:block}main{padding:0}.panel{box-shadow:none}}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading Carbon People…</div></div>
<div id="drawer"></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>

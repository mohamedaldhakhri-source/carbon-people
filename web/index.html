<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carbon People</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of modules, a work area of tables and forms; graphite neutrals with a petrol-blue accent */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e9edef; --line:#d6dde1; --ink:#172126; --muted:#5b6b73;
  --accent:#1d6a83; --accent-ink:#ffffff; --accent-soft:#dcecf1;
  --good:#2f7a4b; --good-soft:#dff1e5; --warn:#9a6a0b; --warn-soft:#f8ecd2; --bad:#b03a2e; --bad-soft:#f7dfdc;
  --rail:#1c272c; --rail-ink:#c9d4d9; --rail-active:#2b3a41;
  --f-display:"Manrope",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11181b; --surface:#182226; --sunk:#1f2b30; --line:#2c3a40; --ink:#e3eaed; --muted:#93a3ab;
  --accent:#5fb3cf; --accent-ink:#0d1a1f; --accent-soft:#1d3a44;
  --good:#6cc892; --good-soft:#1b3326; --warn:#e5b453; --warn-soft:#3a2e14; --bad:#ef7d70; --bad-soft:#3d1f1b;
  --rail:#0c1215; --rail-ink:#aebcc2; --rail-active:#1d2a30; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 16px;display:flex;flex-direction:column;gap:20px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;color:#fff;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--rail-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--rail-active)}
.nav button[aria-current="page"]{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px}
.who{margin-top:auto;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.who b{color:#fff;font-weight:600}
.who .btn{background:transparent;color:var(--rail-ink);border-color:#3a4a51}
main{padding:24px 28px 48px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:2px 0 0}
.grid{display:grid;gap:16px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.tile .n{font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
.mono{font-family:var(--f-mono);font-size:12.5px}
td.mono{white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--accent)} .p-mute{background:var(--sunk);color:var(--muted)}
.btn{font:inherit;font-weight:600;border-radius:6px;padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{filter:brightness(.97)} .btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.sm{padding:4px 10px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input[type=checkbox]{width:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.full{grid-column:1/-1}
.calc{background:var(--sunk);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.msg{border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.good{background:var(--good-soft);color:var(--good)}
.bal{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.bal div{border:1px solid var(--line);border-radius:6px;padding:10px}
.bal b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.bal span{display:block;font-size:12px;color:var(--muted)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);padding:22px;overflow:auto;box-shadow:-8px 0 30px rgb(0 0 0 / .15);z-index:20}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0 0 18px}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;z-index:30;max-width:90vw}
.muted{color:var(--muted)} .small{font-size:12.5px}
.empty{color:var(--muted);padding:8px 0}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .panel{width:min(380px,100%);padding:28px}
.login .brand{color:var(--ink);font-size:24px;margin-bottom:4px}
.login .brand small{color:var(--muted);font-size:13px}
.loading{padding:40px;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{gap:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .who{margin-top:0;flex-direction:row;flex-wrap:wrap;align-items:center}
  main{padding:20px 16px 40px}
  .two{grid-template-columns:1fr}
}
@media print{.rail,.noprint{display:none!important}.app{display:block}}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading Carbon People…</div></div>
<div id="drawer"></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
